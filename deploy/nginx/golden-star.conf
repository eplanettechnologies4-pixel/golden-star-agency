# Golden Star Agency Nginx Configuration

upstream django_backend {
    server 127.0.0.1:8000;
}

upstream fastapi_backend {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name golden-star.pk www.golden-star.pk;

    # Redirect all HTTP traffic to HTTPS (uncomment in production with SSL)
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/golden_star_access.log;
    error_log /var/log/nginx/golden_star_error.log;

    # Static files location
    location /static/ {
        alias /var/www/golden-star/staticfiles/;
    }

    # Media files location (mapped from core_admin/media Docker volume)
    location /media/ {
        alias /var/www/golden-star/core_admin/media/;
    }

    # Route FastAPI specific requests
    location ~ ^/(fastapi|chatbot|n8n) {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route OpenAPI / FastAPI Docs
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route everything else to Django gunicorn
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
