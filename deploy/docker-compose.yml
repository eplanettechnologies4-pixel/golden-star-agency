version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: prod_gsa_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: golden_star_db
    ports:
      - "5432:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prod_gsa_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - prod_redis_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: prod_gsa_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - prod_n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_n8n_data:
