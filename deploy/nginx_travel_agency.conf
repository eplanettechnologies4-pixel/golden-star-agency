# ==============================================================================
# Golden Star Agency — Production Nginx Server Configuration
# Copy to /etc/nginx/conf.d/golden_star.conf or /etc/nginx/sites-available/
# ==============================================================================

upstream django_backend {
    server 127.0.0.1:8000;
}

upstream fastapi_backend {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    access_log /var/log/nginx/golden_star_access.log;
    error_log /var/log/nginx/golden_star_error.log;

    # Static files location (collected via python core_admin/manage.py collectstatic)
    location /static/ {
        alias /var/www/golden-star/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media uploads location (mapped from core_admin/media Docker volume)
    location /media/ {
        alias /var/www/golden-star/core_admin/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Route FastAPI microservice / background service requests
    location ~ ^/(fastapi|n8n) {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route OpenAPI / FastAPI Docs
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default route for Django application
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
