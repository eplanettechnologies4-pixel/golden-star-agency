version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: gsa_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: golden_star_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gsa_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  core_admin:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile.django
    container_name: gsa_django
    restart: always
    command: python core_admin/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/golden_star_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-golden-star-agency-dev-secret-key-123456
      - JWT_SECRET_KEY=super-secret-jwt-signing-key-for-golden-star-agency-fast-api
      - ENCRYPTION_KEY=g-T3J4W1n6o-8RzX_K0aM-Y9sL3v5C7u8X9z0A1B2C3=
    depends_on:
      - postgres
      - redis

  fast_api:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile.fastapi
    container_name: gsa_fastapi
    restart: always
    command: uvicorn fast_api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8001:8000"  # Exposed on port 8001 to avoid conflict with Django
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/golden_star_db
      - JWT_SECRET_KEY=super-secret-jwt-signing-key-for-golden-star-agency-fast-api
    depends_on:
      - postgres
      - redis

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: gsa_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  n8n_data:
