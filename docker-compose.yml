# ==============================================================================
# Golden Star Agency — Docker Compose Configuration
# IMPORTANT: Copy `.env.example` to `.env` before running `docker-compose up`.
# All secrets and environment-specific parameters MUST be placed in `.env`.
# ==============================================================================

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: gsa_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-golden_star_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gsa_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  core_admin:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile.django
    container_name: gsa_django
    restart: always
    command: gunicorn --chdir core_admin config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/core_admin/staticfiles
      - media_volume:/app/core_admin/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  fast_api:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile.fastapi
    container_name: gsa_fastapi
    restart: always
    command: uvicorn fast_api.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - .:/app
    ports:
      - "8001:8000"  # Exposed on port 8001 to avoid conflict with Django
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: gsa_n8n
    restart: always
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  static_volume:
  media_volume:
